{% extends "base.html" %}{% block title %}Jewelry Planner{% endblock %}{% block content %}<section class="planner"><div class="eyebrow">JEWELRY BUDGET PLANNER</div><h1>Your Personalized Jewelry Recommendations</h1><form id="f" class="form card" enctype="multipart/form-data"><label>Budget (₹)<input name="total_budget" type="number" min="1" required></label><label>Occasion<input name="occasion" placeholder="Wedding / Festival" required></label><label>Jewelry Type<input name="jewelry_type" placeholder="Necklace / Earrings / Set" required></label><label>Preferences<textarea name="preferences" placeholder="Metal, color, style..."></textarea></label><label>Outfit Image (optional)<input name="outfit_image" type="file" accept=".jpg,.jpeg,.png,.webp"></label><button class="btn primary">Generate Recommendations</button></form><div id="out" class="result"></div></section><script>
f.onsubmit=async e=>{e.preventDefault();out.textContent="Generating...";let r=await fetch("/jewelry-budget",{method:"POST",body:new FormData(f)});let d=await r.json();out.innerHTML="<h2>AI Recommendation</h2><pre>"+esc(d.result||d.detail||d.error)+"</pre><a class='btn secondary' href='/recommendation-details/"+d.id+"'>View Details</a>"};function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
</script>{% endblock %}
