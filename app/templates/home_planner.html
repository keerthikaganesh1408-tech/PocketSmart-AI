{% extends "base.html" %}{% block title %}Home Planner{% endblock %}{% block content %}<section class="planner"><div class="eyebrow">HOME INTERIOR BUDGET</div><h1>Plan your home within budget</h1><form id="f" class="form card"><label>Total Budget (₹)<input id="budget" type="number" min="1" required></label><div class="two"><label>Lights<input id="lights" type="number" value="4" min="0"></label><label>Fans<input id="fans" type="number" value="4" min="0"></label><label>Furniture<input id="furniture" type="number" value="2" min="0"></label><label>Dining Tables<input id="dining" type="number" value="1" min="0"></label></div><label>Rooms (comma separated)<input id="rooms" placeholder="Living Room, Kitchen, Bedroom"></label><label>Special Requirements<textarea id="req"></textarea></label><button class="btn primary">Generate Recommendations</button></form><div id="out" class="result"></div></section><script>
f.onsubmit=async e=>{e.preventDefault();out.textContent="Generating...";let body={total_budget:+budget.value,num_lights:+lights.value,num_fans:+fans.value,num_furniture:+furniture.value,num_dining_tables:+dining.value,rooms:rooms.value.split(",").map(x=>x.trim()).filter(Boolean),special_requirements:req.value};let r=await fetch("/home-budget",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});let d=await r.json();out.innerHTML="<h2>AI Recommendation</h2><pre>"+esc(d.result||d.detail||d.error)+"</pre><a class='btn secondary' href='/recommendation-details/"+d.id+"'>View Details</a>"};function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
</script>{% endblock %}
