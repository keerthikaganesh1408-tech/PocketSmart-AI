{% extends "base.html" %}{% block title %}Party Planner{% endblock %}{% block content %}<section class="planner"><div class="eyebrow">PARTY BUDGET PLANNER</div><h1>Build a party budget</h1><form id="f" class="form card"><div class="two"><label>Budget (₹)<input id="budget" type="number" min="1" required></label><label>Guests<input id="guests" type="number" min="1" required></label></div><label>Party Type<input id="type" placeholder="Birthday / Wedding" required></label><label>Needs<input id="needs" placeholder="Catering, Decorations, Entertainment"></label><label>Special Requirements<textarea id="req"></textarea></label><button class="btn primary">Generate Recommendations</button></form><div id="out" class="result"></div></section><script>
f.onsubmit=async e=>{e.preventDefault();out.textContent="Generating...";let body={total_budget:+budget.value,num_guests:+guests.value,party_type:type.value,needs:needs.value.split(",").map(x=>x.trim()).filter(Boolean),special_requirements:req.value};let r=await fetch("/party-budget",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});let d=await r.json();out.innerHTML="<h2>AI Recommendation</h2><pre>"+esc(d.result||d.detail||d.error)+"</pre><a class='btn secondary' href='/recommendation-details/"+d.id+"'>View Details</a>"};function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
</script>{% endblock %}
